apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cybersecurity-keyvault
  namespace: default

spec:
  provider: azure

  secretObjects:
    - secretName: cybersecurity-secrets
      type: Opaque

      data:
        - objectName: LANGFUSE-SECRET-KEY
          key: LANGFUSE_SECRET_KEY

        - objectName: LANGFUSE-PUBLIC-KEY
          key: LANGFUSE_PUBLIC_KEY

        - objectName: OPENROUTER-API-KEY
          key: OPENROUTER_API_KEY

        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD

        - objectName: COSMOS-KEY
          key: COSMOS_KEY

        - objectName: DATABASE-URL
          key: DATABASE_URL

  parameters:
    usePodIdentity: "false"

    clientID: "11b78ddd-05c8-43c7-a6c5-5234a9faaa3f"

    keyvaultName: "cyber-kv-7vhgp"

    tenantId: "a270f38d-2db4-4cbc-89a0-21359461bf5c"

    objects: |
      array:
        - |
          objectName: LANGFUSE-SECRET-KEY
          objectType: secret

        - |
          objectName: LANGFUSE-PUBLIC-KEY
          objectType: secret

        - |
          objectName: OPENROUTER-API-KEY
          objectType: secret

        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret

        - |
          objectName: COSMOS-KEY
          objectType: secret

        - |
          objectName: DATABASE-URL
          objectType: secret