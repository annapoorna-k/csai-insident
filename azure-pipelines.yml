trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:

  # ============================================================
  # AZURE
  # ============================================================

  azureServiceConnection: 'cyber-resource-connection'
  acrServiceConnection: 'acr-cyber-connection'

  resourceGroup: 'rg-cybersecurity-dev'
  aksCluster: 'aks-cybersecurity-dev'


  # ============================================================
  # ACR
  # ============================================================

  containerRegistry: 'cybersecurityacr7vhgp.azurecr.io'


  # ============================================================
  # BACKEND
  # ============================================================

  backendRepository: 'cybersecurity-ai-agent-backend'
  backendDockerfile: 'docker/backend.Dockerfile'


  # ============================================================
  # FRONTEND
  # ============================================================

  frontendRepository: 'cybersecurity-ai-agent-frontend'
  frontendDockerfile: 'docker/frontend.Dockerfile'

  # Frontend API URL
  # This is NOT a secret.
  frontendApiBaseUrl: 'http://20.219.175.241'


  # ============================================================
  # IMAGE TAG
  # ============================================================

  imageTag: '$(Build.BuildId)'


# ============================================================
# STAGE 1 - BUILD AND PUSH DOCKER IMAGES
# ============================================================

stages:

- stage: BuildAndPush
  displayName: 'Build and Push Docker Images'

  jobs:

  - job: DockerBuild
    displayName: 'Build Backend and Frontend'

    steps:


    # ========================================================
    # CHECK REPOSITORY STRUCTURE
    # ========================================================

    - script: |

        echo "======================================"
        echo "Repository"
        echo "======================================"

        pwd

        echo "======================================"
        echo "Files"
        echo "======================================"

        find $(Build.SourcesDirectory) -maxdepth 4 -type f | sort

      displayName: 'Check Repository Structure'


    # ========================================================
    # BACKEND IMAGE - BUILD AND PUSH
    # ========================================================

    - task: Docker@2
      displayName: 'Build and Push Backend Image'

      inputs:

        command: buildAndPush

        containerRegistry: '$(acrServiceConnection)'

        repository: '$(backendRepository)'

        dockerfile: '$(backendDockerfile)'

        buildContext: '$(Build.SourcesDirectory)'

        tags: |
          $(imageTag)
          latest


    # ========================================================
    # FRONTEND IMAGE - BUILD
    # ========================================================

    - task: Docker@2
      displayName: 'Build Frontend Image'

      inputs:

        command: build

        containerRegistry: '$(acrServiceConnection)'

        repository: '$(frontendRepository)'

        dockerfile: '$(frontendDockerfile)'

        buildContext: '$(Build.SourcesDirectory)'

        # IMPORTANT:
        # Pass VITE_API_BASE_URL into Docker build
        arguments: '--build-arg VITE_API_BASE_URL=$(frontendApiBaseUrl)'

        tags: |
          $(imageTag)
          latest


    # ========================================================
    # FRONTEND IMAGE - PUSH
    # ========================================================

    - task: Docker@2
      displayName: 'Push Frontend Image'

      inputs:

        command: push

        containerRegistry: '$(acrServiceConnection)'

        repository: '$(frontendRepository)'

        tags: |
          $(imageTag)
          latest


# ============================================================
# STAGE 2 - DEPLOY TO AKS
# ============================================================

- stage: Deploy
  displayName: 'Deploy to AKS'

  dependsOn: BuildAndPush

  condition: succeeded()

  jobs:

  - job: DeployToAKS

    displayName: 'Deploy Backend and Frontend to AKS'

    steps:


    # ========================================================
    # CONNECT TO AKS
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Connect to AKS'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          echo "======================================"
          echo "Connecting to AKS"
          echo "======================================"

          az aks get-credentials \
            --resource-group $(resourceGroup) \
            --name $(aksCluster) \
            --overwrite-existing

          echo "======================================"
          echo "AKS Nodes"
          echo "======================================"

          kubectl get nodes


    # ========================================================
    # UPDATE BACKEND IMAGE TAG
    # ========================================================

    - script: |

        echo "Updating Backend image tag..."

        sed -i \
          "s|BACKEND_IMAGE_TAG|$(imageTag)|g" \
          k8s/deployment.yaml

        echo "Backend deployment image:"

        grep "image:" k8s/deployment.yaml

      displayName: 'Update Backend Image Tag'


    # ========================================================
    # UPDATE FRONTEND IMAGE TAG
    # ========================================================

    - script: |

        echo "Updating Frontend image tag..."

        sed -i \
          "s|FRONTEND_IMAGE_TAG|$(imageTag)|g" \
          k8s/frontend-deployment.yaml

        echo "Frontend deployment image:"

        grep "image:" k8s/frontend-deployment.yaml

      displayName: 'Update Frontend Image Tag'


    # ========================================================
    # DEPLOY BACKEND
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Deploy Backend to AKS'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          echo "======================================"
          echo "Deploying Backend"
          echo "======================================"

          kubectl apply -f k8s/serviceaccount.yaml

          kubectl apply -f k8s/secret-provider-class.yaml

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml

          echo "======================================"
          echo "Backend Pods"
          echo "======================================"

          kubectl get pods


    # ========================================================
    # DEPLOY FRONTEND
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Deploy Frontend to AKS'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          echo "======================================"
          echo "Deploying Frontend"
          echo "======================================"

          kubectl apply -f k8s/frontend-deployment.yaml

          kubectl apply -f k8s/frontend-service.yaml

          echo "======================================"
          echo "Frontend Pods"
          echo "======================================"

          kubectl get pods

