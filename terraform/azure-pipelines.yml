
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Azure DevOps Service Connection
  azureServiceConnection: 'rgcsai-service-connection'

  # Terraform directory
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  # Terraform version
  terraformVersion: '1.9.8'


# ============================================================
# STAGE 1 - VALIDATE
# ============================================================

stages:

- stage: Validate
  displayName: 'Terraform Validate'

  jobs:
  - job: Validate
    displayName: 'Validate Terraform'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "Installing Terraform"
        echo "=========================================="

        TERRAFORM_VERSION="$(terraformVersion)"

        wget -q \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -O /tmp/terraform.zip

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo mv /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version

      displayName: 'Install Terraform'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init


    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - bash: |
        set -e

        cd "$(terraformWorkingDirectory)"

        echo "=========================================="
        echo "Terraform Format Check"
        echo "=========================================="

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'


    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Validate"
          echo "=========================================="

          terraform validate

          echo "=========================================="
          echo "Terraform validation successful"
          echo "=========================================="


# ============================================================
# STAGE 2 - PLAN
# ============================================================

- stage: Plan
  displayName: 'Terraform Plan'

  dependsOn: Validate

  condition: succeeded()

  jobs:
  - job: Plan
    displayName: 'Create Terraform Plan'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "Installing Terraform"
        echo "=========================================="

        TERRAFORM_VERSION="$(terraformVersion)"

        wget -q \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -O /tmp/terraform.zip

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo mv /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version

      displayName: 'Install Terraform'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Plan"
          echo "=========================================="

          echo "Getting Azure subscription ID..."

          AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          echo "Azure subscription detected"

          echo "Checking SSH public key..."

          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: SSH_PUBLIC_KEY pipeline variable is not configured."
            exit 1
          fi

          terraform plan \
            -var="subscription_id=$AZURE_SUBSCRIPTION_ID" \
            -var="location=Central India" \
            -var="resource_group_name=rg-csai" \
            -var="vm_name=csai" \
            -var="acr_name=acrcsai" \
            -var="aks_name=aks-csai" \
            -var="key_vault_name=csai-keys" \
            -var="vm_size=Standard_B2s" \
            -var="admin_username=azureadmin" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -out="tfplan"

          echo "=========================================="
          echo "Terraform Plan Created"
          echo "=========================================="


    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'


# ============================================================
# STAGE 3 - APPLY
# ============================================================

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn: Plan

  condition: succeeded()

  jobs:
  - job: Apply
    displayName: 'Apply Azure Infrastructure'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "Installing Terraform"
        echo "=========================================="

        TERRAFORM_VERSION="$(terraformVersion)"

        wget -q \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -O /tmp/terraform.zip

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo mv /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version

      displayName: 'Install Terraform'


    # --------------------------------------------------------
    # Download Terraform Plan
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan'
      inputs:
        artifact: 'terraform-plan'
        path: '$(Pipeline.Workspace)/terraform-plan'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init


    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          terraform apply \
            -auto-approve \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"

          echo "=========================================="
          echo "Terraform Apply Completed"
          echo "=========================================="


    # --------------------------------------------------------
    # Terraform Outputs
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Outputs'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'

        inlineScript: |
          set -e

          echo "=========================================="
          echo "Terraform Outputs"
          echo "=========================================="

          terraform output

          echo "=========================================="
          echo "INFRASTRUCTURE DEPLOYMENT COMPLETED"
          echo "=========================================="
